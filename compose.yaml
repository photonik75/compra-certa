services:
  postgres-e2e:
    image: postgres:18.4-alpine3.24
    environment:
      POSTGRES_DB: compra_certa_e2e
      POSTGRES_USER: compra_certa
      POSTGRES_PASSWORD: compra_certa
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compra_certa -d compra_certa_e2e"]
      interval: 2s
      timeout: 2s
      retries: 15
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped
