spring.application.name=compra-certa-backend
spring.jackson.deserialization.fail-on-unknown-properties=true
server.port=${PORT:8080}
spring.datasource.hikari.maximum-pool-size=${DATABASE_MAXIMUM_POOL_SIZE:3}
spring.datasource.hikari.minimum-idle=0
compra-certa.email.smtp.enabled=${COMPRA_CERTA_EMAIL_SMTP_ENABLED:false}
compra-certa.email.from=${COMPRA_CERTA_EMAIL_FROM:nao-responda@compra-certa.local}
compra-certa.frontend.base-url=${COMPRA_CERTA_FRONTEND_BASE_URL:https://compra-certa.app}
