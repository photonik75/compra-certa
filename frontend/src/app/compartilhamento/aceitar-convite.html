<main>
  <h1>Convite para lista</h1>
  @if (preview) {
    <p><strong>{{ preview.ownerName }}</strong> convidou você para participar de
      <strong>{{ preview.listName }}</strong>.</p>
    <p>Convite enviado para {{ preview.invitedEmail }}</p>
    <button type="button" [disabled]="sending" (click)="accept()">Aceitar convite</button>
    <a routerLink="/entrar">Entrar</a>
    <a routerLink="/cadastro">Criar conta</a>
  }
  @if (notice) { <p role="alert" aria-live="polite">{{ notice }}</p> }
</main>
