<main>
  <h1>Editar lista</h1>
  @if (message) { <p role="alert">{{ message }}</p> }
  @if (conflict) { <button type="button" (click)="recarregar()">Recarregar dados</button> }
  <form [formGroup]="form" (ngSubmit)="salvar()">
    <label for="edit-name">Nome da lista</label>
    <input id="edit-name" formControlName="name" aria-describedby="edit-name-error">
    <span id="edit-name-error" role="alert"></span>
    <label for="edit-description">Descrição ou observação</label>
    <textarea id="edit-description" formControlName="description"></textarea>
    <button type="submit" [disabled]="form.disabled || form.pristine || sending">Salvar alterações</button>
    <a [routerLink]="['/listas']">Cancelar</a>
  </form>
</main>
