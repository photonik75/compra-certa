<main class="feature-page">
  <header class="feature-topbar">
    <button class="icon-button" type="button" aria-label="Abrir menu">☰</button>
    <button class="icon-button" type="button" aria-label="Voltar">←</button>
    <h1>Nova lista</h1>
    <span></span>
  </header>
  <div class="feature-content">
    <section class="feature-intro">
      <p class="eyebrow">Planejamento</p>
      <h2>O que vamos comprar?</h2>
      <p>Crie uma lista vazia e adicione os itens em seguida.</p>
    </section>
    <form class="form-card surface">
      <label class="field">Nome da lista *<input placeholder="Ex.: Compras do mês"></label>
      <label class="field">Descrição ou observação<textarea placeholder="Ex.: Priorizar produtos em promoção"></textarea></label>
      <small>Opcional · até 240 caracteres</small>
      <footer class="form-actions">
        <button class="secondary-button" type="button">Cancelar</button>
        <button class="primary-button" type="button">Salvar lista</button>
      </footer>
    </form>
  </div>
</main>
