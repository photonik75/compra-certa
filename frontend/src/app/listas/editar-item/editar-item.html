<main class="feature-page">
  <h1>Editar item</h1>
  <form class="form-card surface" [formGroup]="form" (ngSubmit)="save()">
    <label>Produto <input formControlName="productId"></label>
    <label>Quantidade <input formControlName="quantity" inputmode="decimal"></label>
    <label>Unidade <input formControlName="unit"></label>
    <label>Categoria <input formControlName="categoryId"></label>
    <label>Observação <textarea formControlName="notes"></textarea></label>
    @if (notice) { <p role="alert">{{ notice }}</p> }
    @if (conflict) { <button type="button" (click)="reload()">Recarregar dados</button> }
    <button type="button" (click)="cancel()">Cancelar</button>
    <button type="submit" [disabled]="form.pristine">Salvar</button>
  </form>
</main>
