<main class="feature-page">
  <header class="feature-topbar">
    <button class="icon-button" type="button" aria-label="Voltar">←</button>
    <span></span>
    <h1>Adicionar item</h1>
    <span></span>
  </header>
  <div class="feature-content">
    <section class="feature-intro">
      <p class="eyebrow">Compras da semana</p>
      <h2>Qual produto está faltando?</h2>
      <p>Busque um produto já cadastrado ou crie um novo sem sair deste fluxo.</p>
    </section>
    <form class="form-card surface">
      <label class="field">Produto *<input type="search" placeholder="Pesquisar produto"></label>
      <button class="new-product" type="button">＋ Cadastrar novo produto</button>
      <label class="field">Quantidade *<input inputmode="decimal" value="1,5"></label>
      <label class="field">Unidade *<select><option>quilograma</option></select></label>
      <label class="field">Categoria *<select><option>Hortifruti</option></select></label>
      <label class="field">Observação<textarea>Escolher bem fresca</textarea></label>
      <footer class="form-actions">
        <button class="cancel-item" type="button">Cancelar</button>
        <button class="primary-button" type="button">Adicionar item</button>
      </footer>
    </form>
  </div>
</main>
