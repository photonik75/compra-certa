<main class="feature-page">
  <header class="feature-topbar">
    <button class="icon-button menu-button" type="button" [disabled]="encerrandoSessao()" (click)="sair()"
      aria-label="Sair">Sair</button>
    <span></span>
    <h1>Minhas Listas</h1>
    <a class="floating-button" href="/listas/nova" aria-label="Nova lista">
      <span aria-hidden="true">+</span><span class="sr-only">Nova lista</span>
    </a>
  </header>
  <div class="feature-content">
    <section class="feature-intro">
      <p class="eyebrow">Visão geral</p>
      <h2>Olá, Larissa! <span aria-hidden="true">👋</span></h2>
      <p>Você tem 0 itens pendentes em 0 listas ativas.</p>
    </section>
    <label class="search-field">
      <span class="sr-only">Pesquisar listas</span>
      <input type="search" placeholder="Pesquisar listas">
    </label>
    <nav class="filter-pills" aria-label="Filtros de listas">
      <button class="active" type="button">Ativas</button>
      <button type="button">Concluídas</button>
      <button type="button">Todas</button>
    </nav>
    <section class="list-card surface">
      <span class="role-badge">↗ Compartilhada</span>
      <h3>Compras da semana</h3>
      <p>Alterada hoje</p>
      <div class="list-stats">
        <strong>12 <small>itens</small></strong>
        <strong>8 <small>pendentes</small></strong>
      </div>
      <div class="progress"><span></span></div>
      <footer><span>Você é proprietária</span><a href="/listas/1">Abrir →</a></footer>
    </section>
  </div>
</main>
