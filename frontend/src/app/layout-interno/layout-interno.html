<div class="authenticated-layout">
  <button
    #menuToggle
    class="menu-toggle"
    data-action="toggle-menu"
    type="button"
    [attr.aria-label]="menuOpen ? 'Fechar menu' : 'Abrir menu'"
    [attr.aria-expanded]="menuOpen"
    aria-controls="authenticated-menu"
    (click)="toggleMenu()"
  >
    <span aria-hidden="true">{{ menuOpen ? '×' : '☰' }}</span>
  </button>

  <aside
    #menuPanel
    id="authenticated-menu"
    class="menu-lateral"
    aria-label="Menu da área autenticada"
    [attr.data-open]="menuOpen"
  >
    <a
      class="brand"
      routerLink="/listas"
      aria-label="CompraCerta — abrir Minhas listas"
      (click)="navigate()"
    >
      <span aria-hidden="true">✓</span>
      CompraCerta
    </a>

    <nav aria-label="Navegação principal">
      <a routerLink="/listas" routerLinkActive="active" (click)="navigate()">
        <span aria-hidden="true">☷</span>
        Minhas listas
      </a>
      <a routerLink="/categorias" routerLinkActive="active" (click)="navigate()">
        <span aria-hidden="true">▥</span>
        Categorias
      </a>
      <a routerLink="/produtos" routerLinkActive="active" (click)="navigate()">
        <span aria-hidden="true">◇</span>
        Produtos
      </a>
    </nav>

    <footer>
      @if (user) {
        <div class="user">
          <span class="avatar" aria-hidden="true">{{ initials }}</span>
          <span><strong>{{ user.name }}</strong><small>Conta ativa</small></span>
        </div>
      }
      <button data-action="logout" type="button" [disabled]="signingOut" (click)="logout()">
        <span aria-hidden="true">↪</span>
        Sair
      </button>
      @if (error) {
        <p role="alert">{{ error }}</p>
      }
    </footer>
  </aside>

  @if (menuOpen) {
    <button class="menu-overlay" type="button" aria-label="Fechar menu" (click)="closeMenu()"></button>
  }

  <section class="conteudo-interno" [attr.inert]="menuOpen ? '' : null">
    <router-outlet />
  </section>
</div>
